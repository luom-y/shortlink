server:
  port: 5000

spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
        - id: shortlink-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/shortlink/**
        - id: shortlink-redirect
          uri: http://localhost:8082
          predicates:
            - Path=/{code:[a-zA-Z0-9]{6,8}}
        - id: admin-service
          uri: http://localhost:8084
          predicates:
            - Path=/admin/**
